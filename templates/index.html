<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Order nước</title>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f3f4f6; }
        .container { display: grid; grid-template-columns: 1fr 430px; gap: 24px; padding: 30px; }
        .left, .right { background: white; padding: 24px; border-radius: 14px; box-shadow: 0 2px 10px #ddd; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }



        .danger { background: #dc2626; }
        .pay-button { background: #16a34a; font-size: 18px; padding: 15px; }
        .chat { max-height: 140px; overflow: auto; font-size: 14px; margin-top: 10px; }
        .cart-item { border-bottom: 1px solid #e5e7eb; padding: 12px 0; }
        .cart-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; }
        input, select { width: 100%; padding: 10px; margin: 7px 0 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }
        input[type="number"] { width: 90px; }
        .total { font-size: 24px; font-weight: bold; margin: 20px 0; }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }

        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr; }
        }
     .voice-box {
    background: #f5f3ff;
    border: 1px solid #ddd6fe;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
}

.voice-layout {
    display: grid;
    grid-template-columns: 280px 1fr 260px;
    gap: 18px;
    align-items: stretch;
}

.voice-button {
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: white;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-size: 24px;
    font-weight: bold;
    min-height: 260px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
    box-shadow: 0 6px 16px rgba(109, 40, 217, 0.25);
}

.voice-button span {
    line-height: 1.3;
}

.voice-button small {
    background: rgba(0, 0, 0, 0.22);
    padding: 14px;
    border-radius: 12px;
    font-size: 18px;
}

.voice-chat-box {
    background: white;
    border-radius: 16px;
    padding: 18px;
    border: 1px solid #ddd6fe;
}

.voice-chat-box h2 {
    margin: 0 0 14px;
    color: #6d28d9;
}

.voice-status {
    font-weight: bold;
    color: #6d28d9;
    margin-bottom: 12px;
}

.chat {
    height: 175px;
    overflow: auto;
    font-size: 15px;
    background: #fafafa;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 12px;
}

.qr-box {
    background: white;
    border-radius: 16px;
    padding: 14px;
    text-align: center;
    border: 1px solid #ddd6fe;
}

.link-qr {
    width: 180px;
    height: 180px;
    max-width: 100%;
    border-radius: 10px;
}

.qr-text {
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
    color: #6d28d9;
    line-height: 1.35;
}

.qr-link {
    display: block;
    margin-top: 10px;
    font-size: 14px;
    color: #2563eb;
    word-break: break-all;
}

@media (max-width: 1100px) {
    .voice-layout {
        grid-template-columns: 1fr;
    }

    .voice-button {
        min-height: 120px;
    }
}
.menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.drink {
    display: grid;
    grid-template-columns: 170px 1fr;
    gap: 18px;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 18px;
    background: #ffffff;
    align-items: start;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
}

.drink-image {
    width: 170px;
    height: 280px;
    object-fit: cover;
    border-radius: 16px;
}

.drink-info {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.drink-info h3 {
    margin: 0 0 6px;
    text-align: left;
    font-size: 22px;
}

.drink-info p {
    margin: 0;
    font-size: 15px;
}

.drink-info label {
    font-size: 14px;
    font-weight: bold;
    color: #374151;
}

.drink-info select {
    margin: 5px 0 10px;
}

.drink-info button {
    margin-top: 4px;
    height: 44px;
    font-size: 16px;
    border-radius: 12px;
}

@media (max-width: 900px) {
    .container {
        grid-template-columns: 1fr;
    }

    .menu-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {
    .drink {
        grid-template-columns: 130px 1fr;
        gap: 14px;
        padding: 14px;
    }

    .drink-image {
        width: 130px;
        height: 170px;
    }

    .drink-info h3 {
        font-size: 19px;
    }
}
        button {
    width: 100%;
    border: none;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}
    </style>
</head>

<body>
    <div class="container">
        <section class="left">
            <h1>Menu nước</h1>

<div class="voice-box">
    <div class="voice-layout">
        <button class="voice-button" onclick="startVoiceOrder()">
            🎙️
            <span>Chạm vào tôi để<br>order bằng giọng nói</span>
            <small>👆 Bắt đầu</small>
        </button>

        <div class="voice-chat-box">
            <h2>💬 Hội thoại</h2>

            <div class="voice-status" id="voiceStatus">
                Chạm vào nút để bắt đầu.
            </div>

            <div class="chat" id="voiceChat"></div>
        </div>

        <div class="qr-box">
            <a href="http://103.189.203.6:5000/" target="_blank">
                <img
                    class="link-qr"
                    src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=http://103.189.203.6:5000/"
                    alt="QR order trên điện thoại"
                >
            </a>

            <div class="qr-text">
                📱 Quét mã để order<br>trên điện thoại
            </div>

            <a class="qr-link" href="http://103.189.203.6:5000/" target="_blank">
            </a>
        </div>
    </div>
</div>

            <div class="menu-grid">
    {% for drink in drinks %}
    <div class="drink">

        <img
            class="drink-image"
            src="{{ url_for('static', filename=drink.image) }}"
            alt="{{ drink.name }}"
        >

        <div class="drink-info">

            <h3>{{ drink.name }}</h3>

            <p>Ly nhỏ: <b>{{ drink.price | currency }}</b></p>
            <p>Ly lớn: +5.000đ</p>

            <form method="post" action="{{ url_for('add_to_cart', drink_id=drink.id) }}">

                <label>Size ly</label>

                <select name="size">
                    <option value="M">Nhỏ</option>
                    <option value="L">Lớn (+5.000đ)</option>
                </select>

                <label>Đá</label>

                <select name="ice">
                    <option value="yes">Có đá</option>
                    <option value="no">Không đá</option>
                </select>

                <button type="submit">
                    + Thêm món
                </button>

            </form>

        </div>

    </div>
    {% endfor %}
</div>
        </section>

        <section class="right">
            <h1>Thanh toán</h1>
            <div id="cartContent">
                {% include "_cart_content.html" %}
            </div>
        </section>
    </div>

<script>
    let isVoiceOrdering = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;

    async function checkMicrophonePermission() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("Trình duyệt không hỗ trợ getUserMedia.");
        }

        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
        });

        stream.getTracks().forEach(track => track.stop());
    }

    if (!recognition) {
        setVoiceStatus("Trình duyệt chưa hỗ trợ nhận diện giọng nói.");
    } else {
        recognition.lang = "vi-VN";
        recognition.maxAlternatives = 1;
        recognition.interimResults = false;
        recognition.continuous = true;

        recognition.onresult = async function(event) {
            const text = event.results[event.results.length - 1][0].transcript;

            if (!isVoiceOrdering) {
                return;
            }

            addChat("Khách", text);
            await sendVoiceOrder(text);
        };

        recognition.onerror = function(event) {
            console.error("SpeechRecognition error:", event.error);
            setVoiceStatus(`Lỗi nhận diện giọng nói: ${event.error}`);
            isVoiceOrdering = false;
        };

        recognition.onend = function() {
            if (isVoiceOrdering) {
                try {
                    recognition.start();
                } catch (error) {
                    console.error("Không restart được recognition:", error);
                }
            }
        };
    }

    async function startVoiceOrder() {
        if (!recognition) {
            return;
        }

        try {
            await checkMicrophonePermission();

            isVoiceOrdering = true;
            document.getElementById("voiceChat").innerHTML = "";
            setVoiceStatus("Đang khởi động trợ lý order...");

            const response = await fetch("{{ url_for('voice_start') }}", {
                method: "POST",
            });

            const data = await response.json();

            addChat("AI", data.reply);
            speak(data.reply);
            setVoiceStatus("Đang lắng nghe... Bạn cứ nói món muốn đặt.");

            recognition.start();
        } catch (error) {
            console.error("Microphone error:", error);
            setVoiceStatus("Không truy cập được microphone. Kiểm tra quyền mic trong Chrome.");
        }
    }

    function setVoiceStatus(message) {
        document.getElementById("voiceStatus").innerText = message;
    }

    function addChat(label, text) {
        const chat = document.getElementById("voiceChat");
        chat.innerHTML += `<p><b>${label}:</b> ${text}</p>`;
        chat.scrollTop = chat.scrollHeight;
    }

    function speak(text) {
        speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "vi-VN";
        utterance.rate = 1.15;
        utterance.pitch = 1;

        const voices = speechSynthesis.getVoices();
        const vietnameseVoice = voices.find(voice =>
            voice.lang.toLowerCase().includes("vi")
        );

        if (vietnameseVoice) {
            utterance.voice = vietnameseVoice;
        }

        speechSynthesis.speak(utterance);
    }

    speechSynthesis.onvoiceschanged = function() {
        speechSynthesis.getVoices();
    };

    async function sendVoiceOrder(text) {
        setVoiceStatus("AI đang phân tích order...");

        const response = await fetch("{{ url_for('voice_order') }}", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({text: text}),
        });

        const data = await response.json();

        document.getElementById("cartContent").innerHTML = data.cart_html;

        addChat("AI", data.reply);
        speak(data.reply);

        if (data.intent === "confirm") {
            isVoiceOrdering = false;
            recognition.stop();
            window.location.href = data.checkout_url;
            return;
        }

        setVoiceStatus("Đang lắng nghe tiếp...");
    }
</script>
<script>
    async function syncPublicOrder() {
        try {
            const response = await fetch("/api/sync-order-status");
            const data = await response.json();

            if (data.active_order && data.redirect_url) {
                window.location.href = data.redirect_url;
            }
        } catch (error) {
            console.log("Không đồng bộ được order public:", error);
        }
    }

    setInterval(syncPublicOrder, 3000);
    syncPublicOrder();
</script>
</body>
</html>
