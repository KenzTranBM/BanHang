<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Order nước</title>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f3f4f6; }
        .container { display: grid; grid-template-columns: 1fr 430px; gap: 24px; padding: 30px; }
        .left, .right { background: white; padding: 24px; border-radius: 14px; box-shadow: 0 2px 10px #ddd; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }



        .danger { background: #dc2626; }
        .pay-button { background: #16a34a; font-size: 18px; padding: 15px; }
        .chat { max-height: 140px; overflow: auto; font-size: 14px; margin-top: 10px; }
        .cart-item { border-bottom: 1px solid #e5e7eb; padding: 12px 0; }
        .cart-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; }
        input, select { width: 100%; padding: 10px; margin: 7px 0 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }
        input[type="number"] { width: 90px; }
        .total { font-size: 24px; font-weight: bold; margin: 20px 0; }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }

        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr; }
        }
     .voice-box {
    background: #f5f3ff;
    border: 1px solid #ddd6fe;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
}

.voice-layout {
    display: grid;
    grid-template-columns: 280px 1fr 260px;
    gap: 18px;
    align-items: stretch;
}

.voice-button {
    background: linear-gradient(135deg, #8b5cf6, #6d28d9);
    color: white;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-size: 24px;
    font-weight: bold;
    min-height: 260px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
    box-shadow: 0 6px 16px rgba(109, 40, 217, 0.25);
}

.voice-button span {
    line-height: 1.3;
}

.voice-button small {
    background: rgba(0, 0, 0, 0.22);
    padding: 14px;
    border-radius: 12px;
    font-size: 18px;
}

.voice-chat-box {
    background: white;
    border-radius: 16px;
    padding: 18px;
    border: 1px solid #ddd6fe;
}

.voice-chat-box h2 {
    margin: 0 0 14px;
    color: #6d28d9;
}

.voice-status {
    font-weight: bold;
    color: #6d28d9;
    margin-bottom: 12px;
}

.chat {
    height: 175px;
    overflow: auto;
    font-size: 15px;
    background: #fafafa;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 12px;
}

.qr-box {
    background: white;
    border-radius: 16px;
    padding: 14px;
    text-align: center;
    border: 1px solid #ddd6fe;
}

.link-qr {
    width: 180px;
    height: 180px;
    max-width: 100%;
    border-radius: 10px;
}

.qr-text {
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
    color: #6d28d9;
    line-height: 1.35;
}

.qr-link {
    display: block;
    margin-top: 10px;
    font-size: 14px;
    color: #2563eb;
    word-break: break-all;
}

@media (max-width: 1100px) {
    .voice-layout {
        grid-template-columns: 1fr;
    }

    .voice-button {
        min-height: 120px;
    }
}
.menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.drink {
    display: grid;
    grid-template-columns: 170px 1fr;
    gap: 18px;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 18px;
    background: #ffffff;
    align-items: start;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
}

.drink-image {
    width: 170px;
    height: 280px;
    object-fit: cover;
    border-radius: 16px;
}

.drink-info {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.drink-info h3 {
    margin: 0 0 6px;
    text-align: left;
    font-size: 22px;
}

.drink-info p {
    margin: 0;
    font-size: 15px;
}

.drink-info label {
    font-size: 14px;
    font-weight: bold;
    color: #374151;
}

.drink-info select {
    margin: 5px 0 10px;
}

.drink-info button {
    margin-top: 4px;
    height: 44px;
    font-size: 16px;
    border-radius: 12px;
}

@media (max-width: 900px) {
    .container {
        grid-template-columns: 1fr;
    }

    .menu-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {
    .drink {
        grid-template-columns: 130px 1fr;
        gap: 14px;
        padding: 14px;
    }

    .drink-image {
        width: 130px;
        height: 170px;
    }

    .drink-info h3 {
        font-size: 19px;
    }
}
        button {
    width: 100%;
    border: none;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}
    </style>
</head>

<body>
    <div class="container">
        <section class="left">
            <h1>Menu nước</h1>

<div class="voice-box">
    <div class="voice-layout">
        <button class="voice-button" onclick="startVoiceOrder()">
            🎙️
            <span>Chạm vào tôi để<br>order bằng giọng nói</span>
            <small>👆 Bắt đầu</small>
        </button>

        <div class="voice-chat-box">
            <h2>💬 Hội thoại</h2>

            <div class="voice-status" id="voiceStatus">
                Chạm vào nút để bắt đầu.
            </div>

            <div class="chat" id="voiceChat"></div>
        </div>

        <div class="qr-box">
            <a href="http://103.189.203.6:5000/" target="_blank">
                <img
                    class="link-qr"
                    src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=http://103.189.203.6:5000/"
                    alt="QR order trên điện thoại"
                >
            </a>

            <div class="qr-text">
                📱 Quét mã để order<br>trên điện thoại
            </div>

            <a class="qr-link" href="http://103.189.203.6:5000/" target="_blank">
            </a>
        </div>
    </div>
</div>

            <div class="menu-grid">
    {% for drink in drinks %}
    <div class="drink">

        <img
            class="drink-image"
            src="{{ url_for('static', filename=drink.image) }}"
            alt="{{ drink.name }}"
        >

        <div class="drink-info">

            <h3>{{ drink.name }}</h3>

            <p>Ly nhỏ: <b>{{ drink.price | currency }}</b></p>
            <p>Ly lớn: +5.000đ</p>

            <form method="post" action="{{ url_for('add_to_cart', drink_id=drink.id) }}">

                <label>Size ly</label>

                <select name="size">
                    <option value="M">Nhỏ</option>
                    <option value="L">Lớn (+5.000đ)</option>
                </select>

                <label>Đá</label>

                <select name="ice">
                    <option value="yes">Có đá</option>
                    <option value="no">Không đá</option>
                </select>

                <button type="submit">
                    + Thêm món
                </button>

            </form>

        </div>

    </div>
    {% endfor %}
</div>
        </section>

        <section class="right">
            <h1>Thanh toán</h1>
            <div id="cartContent">
                {% include "_cart_content.html" %}
            </div>
        </section>
    </div>

<script>
    let mediaRecorder = null;
    let audioStream = null;
    let audioChunks = [];
    let isListening = false;
    let isProcessingAudio = false;

    const RECORD_CHUNK_MS = 5500;

    async function startVoiceOrder() {
        if (isListening) {
            stopVoiceOrder();
            return;
        }

        try {
            document.getElementById("voiceChat").innerHTML = "";
            setVoiceStatus("Đang khởi động trợ lý order...");

            const response = await fetch("{{ url_for('voice_start') }}", {
                method: "POST",
            });

            const data = await response.json();

            addChat("AI", data.reply);
            await speakAsync(data.reply);

            audioStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true,
                },
            });

            isListening = true;
            updateVoiceButton(true);
            setVoiceStatus("Đang lắng nghe liên tục... Bạn cứ nói món muốn đặt.");

            startRecordingChunk();

        } catch (error) {
            console.error("Microphone error:", error);
            setVoiceStatus("Không truy cập được microphone. Kiểm tra quyền mic trong Chrome.");
            stopVoiceOrder();
        }
    }

    function startRecordingChunk() {
        if (!isListening || !audioStream || isProcessingAudio) {
            return;
        }

        audioChunks = [];

        mediaRecorder = new MediaRecorder(audioStream, {
            mimeType: getSupportedAudioMimeType(),
        });

        mediaRecorder.ondataavailable = function(event) {
            if (event.data && event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = async function() {
            if (!isListening || isProcessingAudio) {
                return;
            }

            isProcessingAudio = true;
            setVoiceStatus("Đang nhận diện giọng nói...");

            try {
                await sendRecordedAudio();
            } finally {
                isProcessingAudio = false;

                if (isListening) {
                    setVoiceStatus("Đang lắng nghe tiếp...");
                    setTimeout(startRecordingChunk, 300);
                }
            }
        };

        mediaRecorder.start();

        setTimeout(function() {
            if (
                isListening &&
                mediaRecorder &&
                mediaRecorder.state === "recording"
            ) {
                mediaRecorder.stop();
            }
        }, RECORD_CHUNK_MS);
    }

    function stopVoiceOrder() {
        isListening = false;
        isProcessingAudio = false;

        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
        }

        if (audioStream) {
            audioStream.getTracks().forEach(track => track.stop());
            audioStream = null;
        }

        updateVoiceButton(false);
        setVoiceStatus("Đã dừng nghe. Bấm nút để bắt đầu lại.");
    }

    function updateVoiceButton(listening) {
        const buttonSmall = document.querySelector(".voice-button small");

        if (!buttonSmall) {
            return;
        }

        buttonSmall.innerText = listening ? "⛔ Đang nghe - bấm để dừng" : "👆 Bắt đầu";
    }

    function getSupportedAudioMimeType() {
        const mimeTypes = [
            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/ogg;codecs=opus",
            "audio/ogg",
        ];

        return mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || "";
    }

    async function sendRecordedAudio() {
        if (!audioChunks.length) {
            return;
        }

        try {
            const audioBlob = new Blob(audioChunks, {
                type: getSupportedAudioMimeType() || "audio/webm",
            });

            if (audioBlob.size < 2500) {
                return;
            }

            const formData = new FormData();
            formData.append("audio", audioBlob, "voice.webm");

            const response = await fetch("{{ url_for('transcribe_audio') }}", {
                method: "POST",
                body: formData,
            });

            const data = await response.json();

            if (!response.ok) {
                console.error("Transcribe error:", data);
                setVoiceStatus(data.error || "Lỗi nhận diện giọng nói.");
                return;
            }

            const text = (data.text || "").trim();

            if (!text) {
                return;
            }

            addChat("Khách", text);
            await sendVoiceOrder(text);

        } catch (error) {
            console.error("Send audio error:", error);
            setVoiceStatus("Lỗi gửi âm thanh lên máy chủ.");
        }
    }

    function setVoiceStatus(message) {
        document.getElementById("voiceStatus").innerText = message;
    }

    function addChat(label, text) {
        const chat = document.getElementById("voiceChat");
        chat.innerHTML += `<p><b>${label}:</b> ${text}</p>`;
        chat.scrollTop = chat.scrollHeight;
    }


    let currentAiAudio = null;

async function speakAsync(text) {
    if (!text) {
        return;
    }

    try {
        if (currentAiAudio) {
            currentAiAudio.pause();
            currentAiAudio = null;
        }

        const response = await fetch("/api/tts", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                text: text,
            }),
        });

        if (!response.ok) {
            console.error("TTS error:", await response.text());
            return;
        }

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);

        currentAiAudio = new Audio(audioUrl);

        await currentAiAudio.play();

        await new Promise(resolve => {
            currentAiAudio.onended = resolve;
            currentAiAudio.onerror = resolve;
        });

        URL.revokeObjectURL(audioUrl);
    } catch (error) {
        console.error("Play AI voice error:", error);
    }
}

function speak(text) {
    speakAsync(text);
}

    async function sendVoiceOrder(text) {
        setVoiceStatus("AI đang phân tích order...");

        const response = await fetch("{{ url_for('voice_order') }}", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({text: text}),
        });

        const data = await response.json();

        document.getElementById("cartContent").innerHTML = data.cart_html;

        addChat("AI", data.reply);
        setVoiceStatus("AI đang trả lời...");
        await speakAsync(data.reply);

        if (data.intent === "confirm") {
            stopVoiceOrder();
            window.location.href = data.checkout_url;
            return;
        }

        setVoiceStatus("Đang lắng nghe tiếp...");
    }
</script>
<script>
    async function syncPublicOrder() {
        try {
            const response = await fetch("/api/sync-order-status");
            const data = await response.json();

            if (data.active_order && data.redirect_url) {
                window.location.href = data.redirect_url;
            }
        } catch (error) {
            console.log("Không đồng bộ được order public:", error);
        }
    }

    setInterval(syncPublicOrder, 3000);
    syncPublicOrder();
</script>
</body>
</html>
